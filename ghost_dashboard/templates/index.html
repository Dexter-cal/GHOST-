<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Framework Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1, h2 {
            color: #4CAF50;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }
        #main-container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }
        .sidebar, .content {
            background-color: #2c2c2c;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background-color: #383838;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        li:hover {
            background-color: #4CAF50;
        }
        #account-details {
            color: #ccc;
        }
    </style>
</head>
<body>
    <h1>Ghost Framework Dashboard</h1>

    <div id="main-container">
        <div class="sidebar">
            <h2>Engagements</h2>
            <ul id="engagement-list">
                <!-- Engagements will be loaded here -->
                <li onclick="loadAccounts('pentest-001')">pentest-001</li>
                 <li onclick="loadAccounts('default')">Default</li>
            </ul>
        </div>
        <div class="content">
            <h2>Account Details</h2>
            <div id="account-list">
                <p>Select an engagement to view accounts.</p>
            </div>
        </div>
    </div>

    <script>
        function loadAccounts(engagementId) {
            fetch(`/api/accounts/${engagementId}`)
                .then(response => response.json())
                .then(data => {
                    const accountList = document.getElementById('account-list');
                    if (Object.keys(data).length === 0) {
                        accountList.innerHTML = '<p>No accounts found for this engagement.</p>';
                        return;
                    }
                    let html = '<ul>';
                    for (const [username, details] of Object.entries(data)) {
                        html += `<li><strong>${username}</strong>: ${details.email} - <em>${details.status}</em></li>`;
                    }
                    html += '</ul>';
                    accountList.innerHTML = html;
                })
                .catch(error => {
                    console.error('Error loading accounts:', error);
                    document.getElementById('account-list').innerHTML = '<p>Error loading accounts.</p>';
                });
        }
    </script>
</body>
</html>
